<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AURAfarming{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23497A44' d='M12 2C7 2 3 6 3 12c0 5.5 4.5 9 9 9s9-3.5 9-9c0-6-4-10-9-10zm0 16.5c-3.6 0-6.5-3-6.5-6.5S8.4 5.5 12 5.5s6.5 3 6.5 6.5-2.9 6.5-6.5 6.5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
        <path d="M20 4C11 6 5 14 5 23c0 7 5 13 15 13s15-6 15-13c0-11-8-17-15-19z" fill="#7FB073"/>
        <path d="M20 8v24M20 14c-4 0-7 3-7 3s3 3 7 3M20 20c4 0 7 3 7 3s-3 3-7 3" stroke="#2F4A2C" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      </svg>
      <div>
        <div class="brand-name">AURAfarming</div>
        <div class="brand-sub">Field Insight</div>
      </div>
    </div>

    <ul class="nav-list">
      <li>
        <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a class="nav-link {% if active_page == 'pests' %}active{% endif %}" href="{{ url_for('pests_page') }}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="13" rx="4" ry="6"/><path d="M12 7V4M9 5l1.5 2M15 5l-1.5 2M4 10l4 1M20 10l-4 1M4 18l4-2M20 18l-4-2"/></svg>
          <span>Pest scan</span>
        </a>
      </li>
      <li>
        <a class="nav-link {% if active_page == 'disease' %}active{% endif %}" href="{{ url_for('disease_page') }}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 4c-6 0-11 5-11 11 0 2.8 2.2 5 5 5 6 0 11-5 11-11 0-1.5-.5-3-1.5-4"/><path d="M9 15c1.5-3 4-5 8-6"/><circle cx="9.5" cy="10.5" r="1"/></svg>
          <span>Disease scan</span>
        </a>
      </li>
      <li>
        <a class="nav-link {% if active_page == 'soil' %}active{% endif %}" href="{{ url_for('soil_page') }}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.5S6 10 6 14.5a6 6 0 0 0 12 0C18 10 12 2.5 12 2.5z"/></svg>
          <span>Soil monitor</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-foot">Local demo &middot; runs on your machine</div>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
